[package]
name = "wsl-tray"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Tray indicator for WSL2: on/off, CPU and memory, one-click shutdown"
license = "BSD-3-Clause"
repository = "https://github.com/ideaconnect/wsl-tray"
readme = "README.md"
build = "build.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
