[package]
name = "wsl-tray"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tray indicator for WSL2: on/off, CPU and memory, one-click shutdown"
license = "BSD-3-Clause"
repository = "https://github.com/ideaconnect/wsl-tray"
readme = "README.md"
build = "build.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Windows 10 variant: the WSL2 VM process is called `vmmem` there instead of
# `vmmemWSL`, so this changes the default of -process. Nothing else differs.
win10 = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
